name: OTAP deploy (reusable)

# Herbruikbare workflow: bouwt de drie omgevingen van een app en publiceert ze
# op één GitHub Pages-site:
#   main         -> /            (Productie)
#   acceptatie   -> /acceptatie/ (Acceptatie)
#   development  -> /test/       (Test)
# Vanaf v2 draait de bouwlogica centraal (bouw/otap_build.py uit deze repo);
# de app heeft alleen een dunne build.py. Branches die nog een volledige,
# eigen build.py hebben (v1) bouwen gewoon zoals voorheen.
# Branches die nog niet bestaan worden overgeslagen.
#
# Publiceren gebeurt NIET met actions/deploy-pages. Die gebruikt de commit van
# de run als Pages-versie, en Pages activeert geen publicatie van een commit
# die al live staat vanaf een andere branch. Bij doorzetten (development ->
# acceptatie -> main, dezelfde commit) bleef acceptatie daardoor de oude versie
# tonen. Deze workflow maakt per publicatie een losse commit met exact dezelfde
# inhoud als de run-commit en gebruikt die als versie. Er wordt GEEN branch
# verplaatst: acceptatie en main wijzen nog steeds naar de geteste commit.
#
# Aanroeper: geef `contents: write` (nodig voor die losse commit). Zonder dat
# recht publiceert deze workflow zoals vroeger, met een waarschuwing in het log.

on:
  workflow_call: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OTAP_CI_DIR: ${{ github.workspace }}/.otap-ci
    steps:
      - name: Checkout productie (main)
        uses: actions/checkout@v4
        with: { ref: main, path: prod, fetch-depth: 1 }

      - name: Checkout acceptatie (indien aanwezig)
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: acceptatie, path: acc, fetch-depth: 1 }

      - name: Checkout test (development, indien aanwezig)
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: development, path: test, fetch-depth: 1 }

      - name: Centrale bouwstap (OTAP-CI v2)
        uses: actions/checkout@v4
        with: { repository: HansdeRooijPrive/OTAP-CI, ref: v2, path: .otap-ci, fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }

      - name: Bouw alle omgevingen
        run: |
          # Per branch:
          # - platform-app (build.py EN app.json) -> bouwen via het platform (incl. public/);
          # - anders, met index.html -> branch staat nog niet op het platform (bijv. tijdens
          #   onboarding; eventueel met een eigen, oude build.py) en wordt ongewijzigd
          #   gepubliceerd, zodat productie online blijft.
          # Na elke omgeving moet er een index.html staan; zo niet, dan stopt de deploy
          # zodat er nooit een lege site live gaat.
          bouw () {  # $1=map  $2=omgeving  $3=doelmap
            if [ -f "$1/build.py" ] && [ -f "$1/app.json" ]; then
              (cd "$1" && python build.py --env="$2" --out "../$3/index.html") || exit 1
            elif [ -f "$1/index.html" ]; then
              echo "::notice::'$1' staat nog niet op het platform (geen app.json): branch wordt ongewijzigd gepubliceerd."
              mkdir -p "$3"
              rsync -a --exclude '.*' --exclude 'README.md' "$1/" "$3/"
            else
              echo "::warning::'$1' heeft geen platform-opzet en geen index.html: overgeslagen."
              return 0
            fi
            if [ ! -f "$3/index.html" ]; then
              echo "::error::Na het bouwen van '$1' staat er geen $3/index.html; deploy gestopt om een lege site te voorkomen."
              exit 1
            fi
          }
          mkdir -p dist
          bouw prod prod dist
          if [ -d acc ];  then bouw acc  acc  dist/acceptatie; fi
          if [ -d test ]; then bouw test test dist/test; fi

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }

      - id: deployment
        name: Publiceren naar Pages (uniek versienummer per publicatie)
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo
            // 1. Versie: een losse commit met dezelfde inhoud als de run-commit (geen branch).
            let versie = context.sha
            try {
              const { data: basis } = await github.request('GET /repos/{owner}/{repo}/git/commits/{commit_sha}', { owner, repo, commit_sha: context.sha })
              const { data: los } = await github.request('POST /repos/{owner}/{repo}/git/commits', {
                owner, repo,
                message: `Pages-publicatie van ${context.sha} (run ${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT})`,
                tree: basis.tree.sha,
                parents: [context.sha]
              })
              versie = los.sha
              core.info(`Publicatieversie ${versie}: losse commit met dezelfde inhoud als ${context.sha}`)
            } catch (e) {
              core.warning(`Geen losse commit mogelijk (HTTP ${e.status}); publiceer met ${context.sha}. Geef in de aanroepende workflow 'contents: write', anders komt een promotie naar acceptatie of productie mogelijk niet live.`)
            }
            // 2. Pages-publicatie met die versie.
            const { data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: versie,
              oidc_token: await core.getIDToken()
            })
            if (dep.page_url) core.setOutput('page_url', dep.page_url)
            // 3. Wachten tot Pages klaar is.
            const id = dep.id || versie
            const fout = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_perms_error', 'deployment_attempt_error']
            for (let i = 0; i < 120; i++) {
              const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', { owner, repo, pages_deployment_id: id })
              if (st.status === 'succeed') { core.info('Pages-publicatie geslaagd'); return }
              if (fout.includes(st.status)) throw new Error('Pages-publicatie mislukt: ' + st.status)
              await new Promise(r => setTimeout(r, 5000))
            }
            throw new Error('Pages-publicatie niet binnen 10 minuten klaar')
