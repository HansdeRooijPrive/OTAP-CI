name: Tests (reusable)

# Draait de geautomatiseerde tests van een app (Playwright + pytest), mits er een
# tests/-map is. Zonder tests/ wordt de stap netjes overgeslagen. De tests kunnen
# `import build` gebruiken; die haalt de centrale bouwstap uit OTAP-CI v2.

on:
  workflow_call: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OTAP_CI_DIR: ${{ github.workspace }}/.otap-ci
    steps:
      - uses: actions/checkout@v4
      - name: Centrale bouwstap (OTAP-CI v2)
        uses: actions/checkout@v4
        with: { repository: HansdeRooijPrive/OTAP-CI, ref: v2, path: .otap-ci, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Tests (indien aanwezig)
        run: |
          if [ -d tests ]; then
            pip install -r requirements-test.txt
            python -m playwright install --with-deps chromium
            pytest -q
          else
            echo "Geen tests/-map — overgeslagen."
          fi
